<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Base Background -->
  <rect width="512" height="512" rx="100" fill="#F6EFE2"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#121212" stroke-width="18"/>

  <!-- Offset Shadow Medallion -->
  <circle cx="264" cy="244" r="150" fill="#121212"/>
  <!-- Primary Yellow Medallion -->
  <circle cx="256" cy="236" r="150" fill="#FFD11A" stroke="#121212" stroke-width="12"/>

  <!-- Crossed Swords / Food Fight Icon -->
  <g transform="translate(156, 136) scale(1.6)" stroke="#121212" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Sword 1 -->
    <line x1="20" y1="105" x2="105" y2="20" />
    <line x1="15" y1="85" x2="40" y2="110" />
    <line x1="20" y1="105" x2="10" y2="115" />
    <!-- Sword 2 -->
    <line x1="105" y1="105" x2="20" y2="20" />
    <line x1="85" y1="110" x2="110" y2="85" />
    <line x1="105" y1="105" x2="115" y2="115" />
  </g>

  <!-- Brand Typography -->
  <rect x="80" y="380" width="352" height="64" rx="16" fill="#121212" />
  <text x="256" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="38" font-weight="900" letter-spacing="4" fill="#FFD11A" text-anchor="middle">
    PALATE
  </text>
</svg>
