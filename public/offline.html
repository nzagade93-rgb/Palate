<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PALATE — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #F6EFE2;
      color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 3px solid #121212;
      border-radius: 18px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 6px 6px 0px #121212;
    }
    .badge {
      display: inline-block;
      background: #FFD11A;
      border: 2px solid #121212;
      color: #121212;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 26px;
      font-weight: 900;
      color: #121212;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }
    p {
      font-size: 14px;
      color: #444444;
      line-height: 1.6;
      margin-bottom: 28px;
      font-weight: 500;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #FFD11A;
      color: #121212;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 0.5px;
      padding: 14px 20px;
      border-radius: 12px;
      border: 2px solid #121212;
      cursor: pointer;
      box-shadow: 3px 3px 0px #121212;
      text-transform: uppercase;
      transition: all 0.1s;
    }
    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #121212;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Offline Connection</div>
    <h1>PALATE FOOD FIGHTS</h1>
    <p>You seem to be disconnected. Reconnect to cast your vote and challenge winning dishes across Navi Mumbai.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
